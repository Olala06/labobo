[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-detective"
version = "0.3.0"
description = "Local phenotype-guided genomic prioritization research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyhpo==4.0.0"]

[project.scripts]
genomic-detective = "genomic_detective.cli:main"

[tool.setuptools.packages.find]
include = ["genomic_detective*"]
