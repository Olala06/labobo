name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: |
          python -m genomic_detective --version
          python -m genomic_detective prepare
      - name: Run sample case and evaluate output
        run: |
          python -m genomic_detective run --dataset examples/demo_case.vcf --phenotype "арахнодактилия эктопия хрусталика расширение корня аорты высокий рост" --output outputs/demo
          python -m genomic_detective evaluate --reports outputs/demo --expected examples/expected_answers.json --output outputs/demo/evaluation.json
          python -c "import json; d=json.load(open('outputs/demo/evaluation.json', encoding='utf-8')); assert d['checked'] == 1 and d['top1_accuracy'] == 1.0, d"

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable Python with same launcher as Start.cmd
        shell: powershell
        run: |
          . ./scripts/python-runtime.ps1
          $env:GENOMIC_PYTHON = Resolve-GenomicPython -ProjectRoot $PWD -AllowDownload
          if (-not (Test-Path $env:GENOMIC_PYTHON)) { throw "Python runtime missing" }
      - name: Run Windows tests and sample analysis through run.ps1
        shell: powershell
        run: |
          ./run.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./run.ps1 run --dataset examples/demo_case.vcf --phenotype "арахнодактилия эктопия хрусталика расширение корня аорты высокий рост" --output outputs/demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./run.ps1 evaluate --reports outputs/demo --expected examples/expected_answers.json --output outputs/demo/evaluation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
