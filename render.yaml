services:
  - type: web
    name: labobo-genomic-detective
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install .
    startCommand: python -m genomic_detective serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        generateValue: true
